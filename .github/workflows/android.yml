# 웹 화면을 안드로이드 앱(APK)으로 감싸 Releases의 'apk' 항목에 올린다.
# 데이터(data/) 변경으로는 다시 빌드하지 않는다 — 앱이 GitHub에서 최신 데이터를 직접 읽기 때문.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["index.html", "css/**", "js/**", "icons/**", "manifest.webmanifest", "app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor 설치 및 웹 화면 복사
        run: |
          npm install --no-audit --no-fund
          npm run prepare-www

      - name: 안드로이드 프로젝트 생성
        run: |
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#1e5e3b' --splashBackgroundColor '#1e5e3b'
          npx cap sync android

      - name: 버전 번호 (설치된 앱 위에 업데이트되도록 매번 증가)
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: 서명 키 준비
        # 저장소 Secrets(ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD)가 있으면 비공개 키로,
        # 없으면 공개 저장소의 대체 키(fallback-release.p12)로 서명한다.
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > release.p12
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "서명: 비공개 키(Secrets)"
          else
            cp fallback-release.p12 release.p12
            echo "KS_PASS=golfround" >> "$GITHUB_ENV"
            echo "::warning::Secrets가 없어 공개 대체 키로 서명합니다."
          fi
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("../../release.p12")
                      storeType "pkcs12"
                      storePassword System.getenv("KS_PASS")
                      keyAlias "golfround"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      debuggable false
                  }
              }
          }
          GRADLE

      - name: APK 빌드 (릴리스)
        run: |
          cd android && ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../golf-round.apk
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner" verify --print-certs ../golf-round.apk | head -3

      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk \
            --title "골프 라운드 안드로이드 앱" \
            --notes "휴대폰에서 golf-round.apk를 내려받아 설치하세요. 웹 화면을 고치면 자동으로 새로 빌드됩니다."
          gh release upload apk golf-round.apk --clobber
          gh release edit apk --notes "휴대폰에서 golf-round.apk를 내려받아 설치하세요. 최근 빌드: 1.0.${{ github.run_number }} ($(date -u +%Y-%m-%d))"
